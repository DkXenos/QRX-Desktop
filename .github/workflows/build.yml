name: QRX-Desktop

# Every push runs the tests on Windows, macOS and Linux, then builds the apps
# with the same build.py you run locally. Pushing a tag like v2.1.0 also
# publishes the apps as a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: [".pushr_dummy", "README.md"]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt zxing-cpp
      - name: Run tests
        shell: bash
        env:
          # On the throwaway Windows runner, also test a Desktop moved into OneDrive.
          QRX_TEST_MOVE_DESKTOP: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run || { sudo apt-get update -q && sudo apt-get install -yq xvfb; }
            xvfb-run -a python -m unittest -v
          else
            python -m unittest -v
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: QRX-Desktop.exe
          - os: macos-latest
            file: QRX-Desktop-mac.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py

      - name: Check the app opens (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process dist\QRX-Desktop.exe
          foreach ($second in 1..90) {
            Start-Sleep 1
            $app = Get-Process QRX-Desktop -ErrorAction SilentlyContinue |
              Where-Object MainWindowTitle -like "QRX Desktop*"
            if ($app) {
              "Window is up after $second s: $($app.MainWindowTitle)"
              Stop-Process -Name QRX-Desktop
              exit 0
            }
          }
          Get-Process QRX-Desktop -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle
          throw "The QRX Desktop window never appeared"

      - name: Check the app opens (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/QRX-Desktop.app/Contents/MacOS/QRX-Desktop 2> app.log &
          sleep 15
          cat app.log
          kill -0 $! || { echo "The app quit on its own"; exit 1; }
          kill $!
          if grep -q Traceback app.log; then exit 1; fi
          echo "The app is still running after 15 s"

      - name: Zip the Mac app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/QRX-Desktop.app dist/QRX-Desktop-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            QRX-Desktop.exe
            QRX-Desktop-mac.zip
          generate_release_notes: true
