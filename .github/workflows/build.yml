name: Build QRX-Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          if [ -f "assets/icon.png" ]; then
            pyinstaller --onefile --windowed --name "QRX-Desktop" --icon "assets/icon.png" main.py
          else
            pyinstaller --onefile --windowed --name "QRX-Desktop" main.py
          fi

      - name: Zip .app bundle
        run: |
          cd dist
          zip -r QRX-Desktop-mac.zip "QRX-Desktop.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRX-Desktop-mac
          path: dist/QRX-Desktop-mac.zip

  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          if (Test-Path "assets/icon.png") {
            pyinstaller --onefile --windowed --name "QRX-Desktop" --icon "assets/icon.png" main.py
          } else {
            pyinstaller --onefile --windowed --name "QRX-Desktop" main.py
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRX-Desktop-windows
          path: dist/QRX-Desktop.exe

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: QRX-Desktop-mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: QRX-Desktop-windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QRX-Desktop-mac.zip
            QRX-Desktop.exe
          generate_release_notes: true
